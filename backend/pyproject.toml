[project]
name = "noti-backend"
version = "1.0.0"
description = "noti — open-source notification platform API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django==5.2.11",
    "djangorestframework==3.16.1",
    "djangorestframework-simplejwt==5.5.1",
    "django-cors-headers==4.9.0",
    "django-filter==25.2",
    "django-environ==0.12.0",
    "django-redis==6.0.0",
    "django-celery-beat==2.8.1",
    "celery==5.6.2",
    "redis==7.1.0",
    "psycopg2==2.9.10",
    "drf-spectacular==0.29.0",
    "pyjwt==2.11.0",
    "cryptography==46.0.4",
    "pydantic>=2.8,<3",
    "httpx==0.28.1",
    "requests==2.32.5",
    "firebase-admin==7.1.0",
    "gunicorn==25.0.2",
    "opentelemetry-sdk>=1.34,<2",
    "opentelemetry-instrumentation-django>=0.55b0,<0.60",
    "opentelemetry-instrumentation-celery>=0.55b0,<0.60",
    "opentelemetry-instrumentation-logging>=0.55b0,<0.60",
    "opentelemetry-exporter-otlp>=1.34,<2",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
    "pytest-django==4.11.1",
    "responses==0.25.8",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py", "*_tests.py"]
addopts = "--strict-markers"
